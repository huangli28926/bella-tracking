<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>埋点矫正汇总</title>
  <style>
    :root {
      --ink: #1b2320;
      --paper: #f3efe6;
      --paper-2: #fbf8f2;
      --line: #d9d0c3;
      --accent: #c45c26;
      --ok: #2f6f62;
      --warn: #a15c12;
      --danger: #9b2c2c;
      --sidebar: #fff;
      --mono: Menlo, Consolas, monospace;
      --sans: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { font-family: var(--sans); background: var(--paper); color: var(--ink); }
    .app {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      min-height: 100%;
    }
    .side {
      background: var(--sidebar);
      color: var(--ink);
      border-right: 1px solid var(--line);
      padding: 14px 12px 12px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      max-height: 100vh;
      position: sticky;
      top: 0;
    }
    .side-search { margin-bottom: 10px; }
    .side-search input {
      width: 100%;
      background: var(--paper-2);
      border: 1px solid var(--line);
      color: var(--ink);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
      font-family: var(--sans);
      outline: none;
    }
    .side-search input::placeholder { color: #7d756a; }
    .side-search input:focus { border-color: var(--accent); }
    .filters {
      display: flex;
      flex-wrap: nowrap;
      gap: 4px;
      margin-bottom: 10px;
      overflow-x: auto;
    }
    .filters button {
      border: 0;
      background: transparent;
      color: #7d756a;
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .filters button .n { margin-left: 4px; color: #7d756a; }
    .filters button.active { background: var(--paper); color: var(--accent); }
    .filters button.active .n { color: var(--accent); }
    .nav {
      overflow: auto;
      flex: 1;
      margin: 0 -4px;
      padding: 0 4px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      text-align: left;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink);
      padding: 8px;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 4px;
    }
    .nav-item:hover { background: var(--paper); }
    .nav-item.active { background: #fff8ee; border-color: var(--accent); }
    .nav-thumb {
      width: 48px;
      height: 64px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
      background: var(--paper);
      border: 1px solid var(--line);
    }
    .nav-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .nav-body { min-width: 0; flex: 1; }
    .nav-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; }
    .nav-item .name {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .nav-item .evt { display: block; margin-top: 4px; font-family: var(--mono); font-size: 11px; color: #7d756a; }
    .nav-pager {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex-wrap: wrap;
      padding-top: 10px;
    }
    .nav-pager button {
      min-width: 26px;
      height: 26px;
      border: 0;
      background: transparent;
      color: #7d756a;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .nav-pager button.active { background: var(--paper); color: var(--ink); }
    .nav-pager button:disabled { opacity: 0.35; cursor: default; }
    .nav-pager .gap { color: #7d756a; font-size: 12px; padding: 0 2px; }
    .main {
      padding: 24px 28px 64px;
      min-width: 0;
    }
    .top {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      margin-bottom: 16px;
    }
    .top h2 { margin: 0; font-size: 20px; font-weight: 650; }
    .top .sub { margin-top: 6px; font-size: 12px; color: #7d756a; line-height: 1.6; }
    .links { display: flex; gap: 8px; flex-wrap: wrap; }
    .links a {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      text-decoration: none;
      font-size: 12px;
    }
    .links a.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .banner {
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 16px;
      font-size: 13px;
      line-height: 1.6;
    }
    .banner.ok { background: #e1f0eb; border: 1px solid #9ed0c4; color: var(--ok); }
    .banner.warn { background: #fff4e5; border: 1px solid #efc37a; color: var(--warn); }
    .table-wrap {
      overflow-x: auto;
      background: var(--paper-2);
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: auto;
    }
    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      font-size: 13px;
    }
    th {
      background: #efe8dc;
      font-size: 12px;
      font-weight: 650;
      color: #7d756a;
      white-space: nowrap;
    }
    tr:last-child td { border-bottom: 0; }
    tr.highlight td { background: #fff4e5; }
    col.fit { width: 1%; }
    col.grow { width: auto; }
    th.fit, td.fit {
      white-space: nowrap;
      width: 1%;
    }
    th.grow, td.grow {
      width: auto;
      white-space: normal;
      word-break: break-word;
    }
    .chip {
      display: inline-block;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 11px;
      white-space: nowrap;
    }
    .chip.ok { background: #e1f0eb; color: var(--ok); }
    .chip.warn { background: #fff4e5; color: var(--warn); }
    .chip.pending { background: #f0ece4; color: #7d756a; }
    .nav .chip { flex-shrink: 0; font-size: 10px; }
    .nav .chip.pending { background: #fff4e5; color: var(--warn); }
    .nav .chip.ok { background: #e1f0eb; color: var(--ok); }
    .nav .chip.problem { background: #f8eaea; color: var(--danger); }
    .reasons { margin: 0; padding-left: 18px; color: #7d756a; }
    code { font-family: var(--mono); font-size: 12px; }
    .empty {
      padding: 28px 16px;
      text-align: center;
      color: #7d756a;
      font-size: 13px;
    }
    .nav .empty { padding: 16px 8px; text-align: left; color: #9aa89f; }
    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .side { position: relative; max-height: none; min-height: 0; }
      .nav { max-height: 280px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="side-search">
        <input id="nav-search" type="search" placeholder="搜索 事件/页面/evtId" autocomplete="off" />
      </div>
      <div class="filters" id="filters"></div>
      <div class="nav" id="nav"></div>
      <div class="nav-pager" id="nav-pager"></div>
    </aside>
    <main class="main">
      <div class="top">
        <div>
          <h2>矫正结果</h2>
          <div class="sub" id="subtitle"></div>
        </div>
        <div class="links" id="links"></div>
      </div>
      <div id="banner"></div>
      <div class="table-wrap">
        <table>
          <colgroup>
            <col class="fit" />
            <col class="fit" />
            <col class="fit" />
            <col class="fit" />
            <col class="grow" />
          </colgroup>
          <thead>
            <tr>
              <th class="fit">evtId</th>
              <th class="fit">事件</th>
              <th class="fit">类型</th>
              <th class="fit">状态</th>
              <th class="grow">待确认原因</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty" id="empty" hidden>当前筛选下没有事件</div>
      </div>
    </main>
  </div>
  <script id="review-data" type="application/json">__REVIEW_JSON__</script>
  <script>
    (function () {
      var report = JSON.parse(document.getElementById('review-data').textContent);
      var summary = report.summary || {};
      var events = report.events || [];
      var filter = 'all';
      var selectedId = '';
      var navQuery = '';
      var navPage = 1;
      var NAV_PAGE_SIZE = 10;

      function esc(v) {
        return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }
      function navStatus(event) {
        var review = event.review || {};
        var impl = event.impl || {};
        if (review.confirmed) return 'confirmed';
        if (impl.uicodeConflict || (impl.unresolved && impl.unresolved.length)) return 'problem';
        if (review.needsConfirm) return 'pending';
        return 'pending';
      }
      function navChip(status) {
        if (status === 'confirmed') return { cls: 'ok', text: '已确认' };
        if (status === 'problem') return { cls: 'problem', text: '有问题' };
        return { cls: 'pending', text: '待确认' };
      }
      function matchQuery(event) {
        var q = String(navQuery || '').trim().toLowerCase();
        if (!q) return true;
        return [event.evtId, event.eventName, event.pageName, event.event, event.uicode]
          .join(' ').toLowerCase().indexOf(q) !== -1;
      }
      function matchFilter(event) {
        if (!matchQuery(event)) return false;
        var st = navStatus(event);
        if (filter === 'open') return st === 'pending';
        if (filter === 'confirmed') return st === 'confirmed';
        if (filter === 'problem') return st === 'problem';
        return true;
      }
      function chipHtml(event) {
        var review = event.review || {};
        if (review.confirmed) return '<span class="chip ok">已确认</span>';
        if (review.needsConfirm) return '<span class="chip warn">待确认</span>';
        return '<span class="chip pending">无需打断</span>';
      }
      function reasonsHtml(event) {
        var reasons = (event.review || {}).reasons || [];
        if (!reasons.length) return '-';
        return '<ul class="reasons">' + reasons.map(function (r) {
          return '<li>' + esc(r) + '</li>';
        }).join('') + '</ul>';
      }
      function searched() {
        return events.filter(matchQuery);
      }
      function visibleEvents() {
        return events.filter(matchFilter);
      }
      function navCounts() {
        var list = searched();
        var counts = { all: list.length, open: 0, confirmed: 0, problem: 0 };
        list.forEach(function (event) {
          var st = navStatus(event);
          if (st === 'pending') counts.open += 1;
          else counts[st] += 1;
        });
        return counts;
      }

      document.title = (report.slug || '埋点') + ' · 矫正汇总';
      document.getElementById('subtitle').textContent =
        '共 ' + (summary.total || 0) + ' 条事件，曾需确认 ' + (summary.needsConfirmCount || 0) +
        ' 条，仍待处理 ' + (summary.pendingCount || 0) + ' 条';

      var banner = document.getElementById('banner');
      if (summary.done) {
        banner.className = 'banner ok';
        banner.textContent = '全部需确认项已处理完成。可进入写码阶段（路径 C）。';
      } else {
        banner.className = 'banner warn';
        banner.textContent = '仍有 ' + (summary.pendingCount || 0) + ' 条待确认。可继续运行 confirm-sweep 或在落库页补确认。';
      }

      var implName = (report.htmlPath || '').split('/').pop() || '';
      document.getElementById('links').innerHTML =
        (implName ? '<a class="primary" href="./' + esc(implName) + '">打开落库页</a>' : '') +
        '<a href="./_raw/' + esc(report.slug || '') + '.impl.json">impl.json</a>';

      function bindClicks(root, attr, handler) {
        root.querySelectorAll('[' + attr + ']').forEach(function (el) {
          el.onclick = function () { handler(el.getAttribute(attr)); };
        });
      }

      function renderFilters() {
        var counts = navCounts();
        var items = [
          ['all', '全部', counts.all],
          ['open', '待确认', counts.open],
          ['confirmed', '已确认', counts.confirmed],
          ['problem', '有问题', counts.problem]
        ];
        document.getElementById('filters').innerHTML = items.map(function (item) {
          return '<button type="button" data-filter="' + item[0] + '"' +
            (filter === item[0] ? ' class="active"' : '') + '>' +
            item[1] + '<span class="n">' + item[2] + '</span></button>';
        }).join('');
        bindClicks(document.getElementById('filters'), 'data-filter', function (value) {
          filter = value;
          navPage = 1;
          renderList();
        });
      }

      function pagerPages(totalPages, current) {
        if (totalPages <= 7) {
          return Array.apply(null, { length: totalPages }).map(function (_, i) { return i + 1; });
        }
        var pages = [1];
        var start = Math.max(2, current - 1);
        var end = Math.min(totalPages - 1, current + 1);
        if (start > 2) pages.push('…');
        for (var i = start; i <= end; i++) pages.push(i);
        if (end < totalPages - 1) pages.push('…');
        pages.push(totalPages);
        return pages;
      }

      function renderPager(total, page, pages) {
        var el = document.getElementById('nav-pager');
        if (total <= NAV_PAGE_SIZE) {
          el.innerHTML = '';
          return;
        }
        var bits = ['<button type="button" data-page="prev"' + (page <= 1 ? ' disabled' : '') + '>&lt;</button>'];
        pagerPages(pages, page).forEach(function (item) {
          if (item === '…') {
            bits.push('<span class="gap">…</span>');
            return;
          }
          bits.push('<button type="button" data-page="' + item + '"' +
            (item === page ? ' class="active"' : '') + '>' + item + '</button>');
        });
        bits.push('<button type="button" data-page="next"' + (page >= pages ? ' disabled' : '') + '>&gt;</button>');
        el.innerHTML = bits.join('');
        bindClicks(el, 'data-page', function (value) {
          var nextPages = Math.max(1, Math.ceil(visibleEvents().length / NAV_PAGE_SIZE) || 1);
          if (value === 'prev') navPage = Math.max(1, navPage - 1);
          else if (value === 'next') navPage = Math.min(nextPages, navPage + 1);
          else navPage = parseInt(value, 10) || navPage;
          var list = visibleEvents();
          var slice = list.slice((navPage - 1) * NAV_PAGE_SIZE, navPage * NAV_PAGE_SIZE);
          if (slice.length && !slice.some(function (item) { return String(item.evtId) === selectedId; })) {
            selectedId = String(slice[0].evtId);
          }
          renderList();
        });
      }

      function renderList() {
        renderFilters();
        var list = visibleEvents();
        var pages = Math.max(1, Math.ceil(list.length / NAV_PAGE_SIZE) || 1);
        var idx = list.findIndex(function (item) { return String(item.evtId) === String(selectedId); });
        if (idx >= 0) navPage = Math.floor(idx / NAV_PAGE_SIZE) + 1;
        if (navPage > pages) navPage = pages;
        if (navPage < 1) navPage = 1;
        var slice = list.slice((navPage - 1) * NAV_PAGE_SIZE, navPage * NAV_PAGE_SIZE);
        document.getElementById('nav').innerHTML = slice.map(function (event) {
          var chip = navChip(navStatus(event));
          var thumb = event.diagramSrc ? '<img src="' + esc(event.diagramSrc) + '" alt="" />' : '';
          return '<button type="button" class="nav-item' + (selectedId === String(event.evtId) ? ' active' : '') +
            '" data-evt="' + esc(event.evtId) + '">' +
            '<span class="nav-thumb">' + thumb + '</span>' +
            '<span class="nav-body"><span class="nav-top">' +
            '<span class="name">' + esc(event.eventName || '-') + '</span>' +
            '<span class="chip ' + chip.cls + '">' + chip.text + '</span>' +
            '</span><span class="evt">evt: ' + esc(event.evtId) + '</span></span></button>';
        }).join('') || '<div class="empty">当前筛选下没有事件</div>';
        renderPager(list.length, navPage, pages);

        document.getElementById('rows').innerHTML = list.map(function (event) {
          return '<tr id="row-' + esc(event.evtId) + '" data-evt="' + esc(event.evtId) + '"' +
            (selectedId === String(event.evtId) ? ' class="highlight"' : '') + '>' +
            '<td class="fit"><code>' + esc(event.evtId) + '</code></td>' +
            '<td class="fit">' + esc(event.eventName || '-') + '</td>' +
            '<td class="fit">' + esc(event.kind === 'click' ? '点击' : '曝光') + '</td>' +
            '<td class="fit">' + chipHtml(event) + '</td>' +
            '<td class="grow">' + reasonsHtml(event) + '</td>' +
            '</tr>';
        }).join('');

        var empty = document.getElementById('empty');
        empty.hidden = list.length > 0;
        document.querySelector('table').hidden = list.length === 0;

        bindClicks(document.getElementById('nav'), 'data-evt', selectEvt);
        bindClicks(document.getElementById('rows'), 'data-evt', selectEvt);
      }

      function selectEvt(evtId) {
        selectedId = String(evtId || '');
        renderList();
        var row = document.getElementById('row-' + selectedId);
        if (row) row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }

      document.getElementById('nav-search').addEventListener('input', function (e) {
        navQuery = e.target.value || '';
        navPage = 1;
        renderList();
      });
      renderFilters();
      renderList();
    }());
  </script>
</body>
</html>
